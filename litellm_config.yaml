# LiteLLM Proxy Configuration for Hydra
#
# Place this file alongside docker-compose.yml.
# Set LITELLM_MASTER_KEY and ANTHROPIC_API_KEY in your environment
# (or a .env file next to docker-compose.yml) before running `docker-compose up`.
#
# In hydra.yaml, configure agents to use this proxy:
#   llm:
#     provider: litellm
#     base_url: http://localhost:4000
#     api_key: env:LITELLM_MASTER_KEY

model_list:
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # SQLite spend tracking DB (set via DATABASE_URL env var in docker-compose)
  # Switch to postgres for production: postgresql://user:pass@host/litellm
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  # Drop unsupported params instead of erroring (improves compatibility)
  drop_params: true
  # Set to a number to enable request-level caching (seconds)
  # cache: true
  # cache_params:
  #   type: local
  #   ttl: 600
